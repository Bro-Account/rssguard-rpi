name: Build, test & publish RSSGuard (Debian 13, aarch64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RSSGuard version to build (leave empty to auto-detect the latest upstream release)"
        required: false
  push:
    tags:
      - "v*"
  schedule:
    # Daily check for new upstream RSSGuard releases
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Tag pushes build exactly that tag.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual runs may request a specific version.
          REQUESTED="${{ github.event.inputs.version }}"
          if [ -n "$REQUESTED" ]; then
            echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Auto-detection: latest upstream release, unless we already
          # published a release for it here.
          UPSTREAM="$(gh api repos/martinrotter/rssguard/releases/latest --jq .tag_name)"
          UPSTREAM="${UPSTREAM#v}"
          if gh release view "v$UPSTREAM" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Upstream $UPSTREAM is already released here - nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream release detected: $UPSTREAM"
            echo "version=$UPSTREAM" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:13
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      # Packages the RSSGuard build script does not install itself and which
      # are missing from the bare debian:13 image.
      - name: Install base packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 perl bzip2

      - uses: actions/checkout@v7

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: build-library
          key: rssguard-build-${{ env.VERSION }}
          restore-keys: rssguard-build-${{ env.VERSION }}

      - name: Build RSSGuard ${{ env.VERSION }}
        run: ./update-rssguard.sh "${VERSION}" --build-only --no-prebuilt

      - name: Package build
        run: |
          CACHE_DIR="build-library/rssguard/${VERSION}-aarch64-debian-13"
          if [ ! -x "${CACHE_DIR}/bin/rssguard" ]; then
            echo "Expected cache directory not found: ${CACHE_DIR}" >&2
            exit 1
          fi
          # Contents map directly onto /usr/local (bin/, lib/, share/, ...).
          tar -czf "rssguard-${VERSION}-linux-aarch64.tar.gz" \
            --exclude="./state" \
            -C "$CACHE_DIR" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rssguard-${{ env.VERSION }}-linux-aarch64
          path: rssguard-${{ env.VERSION }}-linux-aarch64.tar.gz

  smoke-test:
    name: Smoke test on clean Debian 13
    needs: [version, build]
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:13
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      # Deliberately ONLY runtime packages (no -dev packages, no build
      # tools): this container models a stock Raspberry Pi OS system.
      # The Qt6 module list mirrors the runtime libraries librssguard.so
      # links against (Qt base, WebEngine, Multimedia, QML/Quick, mpv).
      - name: Install runtime & test packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates xvfb imagemagick fonts-dejavu-core \
            libqt6core6t64 libqt6widgets6 libqt6gui6 libqt6network6 \
            libqt6sql6 libqt6xml6 libqt6concurrent6 libqt6printsupport6 \
            libqt6opengl6 libqt6openglwidgets6 libqt6dbus6 \
            libqt6webenginecore6 libqt6webenginewidgets6 \
            libqt6multimedia6 libqt6qml6 libqt6quick6 libmpv2 \
            libqt6sql6-sqlite \
            qml6-module-qtqml-workerscript qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtwebengine \
            libgl1 libegl1

      - uses: actions/checkout@v7

      - name: Download built tarball
        uses: actions/download-artifact@v8
        with:
          name: rssguard-${{ env.VERSION }}-linux-aarch64
          path: dist
          merge-multiple: true

      - name: Smoke test (launch on clean system)
        run: bash tests/smoke-test.sh "dist/rssguard-${VERSION}-linux-aarch64.tar.gz"

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rssguard-smoke-${{ env.VERSION }}
          path: |
            /tmp/rssguard-smoke.png
            /tmp/rssguard-stderr.log
            /tmp/rssguard-stdout.log
          if-no-files-found: ignore

  publish:
    name: Publish release
    needs: [version, build, smoke-test]
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Download built tarball
        uses: actions/download-artifact@v8
        with:
          name: rssguard-${{ env.VERSION }}-linux-aarch64
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release (tag & automatic builds)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          files: dist/rssguard-${{ env.VERSION }}-linux-aarch64.tar.gz
          body: |
            Prebuilt [RSSGuard](https://github.com/martinrotter/rssguard) ${{ env.VERSION }}
            for Raspberry Pi OS / Debian 13 (aarch64), built and smoke-tested
            automatically from upstream source in GitHub Actions.

            RSSGuard is GPLv3 — source code:
            https://github.com/martinrotter/rssguard/releases/tag/${{ env.VERSION }}

            ### Install (recommended: let the script do it)

                ./update-rssguard.sh ${{ env.VERSION }}

            ### Manual install

                sudo tar -xzf rssguard-${{ env.VERSION }}-linux-aarch64.tar.gz -C /usr/local
                sudo ldconfig
